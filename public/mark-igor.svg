<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Igor — la pousse tressée">
  <!-- « La pousse tressée » : deux feuilles s'ouvrent d'une tige tressée, ancrée
       par des racines. Le commun se tresse (la tige) et fait culture (les feuilles).
       Illustration vivante — registre paysan-libre. -->

  <!-- feuille gauche (verte) -->
  <path d="M50,47 C45,46 33,45 24,16 C30,28 41,39 51,46 Z" fill="#2E7D4E"/>
  <path d="M48,45 C40,38 32,30 27,20" fill="none" stroke="#F5F7F2" stroke-width="2.4"
        stroke-linecap="round" opacity="0.6"/>

  <!-- feuille droite (terre) -->
  <path d="M50,47 C55,46 67,45 76,16 C70,28 59,39 49,46 Z" fill="#E2622E"/>
  <path d="M52,45 C60,38 68,30 73,20" fill="none" stroke="#F5F7F2" stroke-width="2.4"
        stroke-linecap="round" opacity="0.6"/>

  <!-- tige tressée — deux fibres twinées -->
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M50,47 C44,51 44,55 50,58 C56,61 56,68 50,73 C45,76 46,80 50,84" stroke="#2E7D4E"/>
    <path d="M50,47 C56,51 56,55 50,58 C44,61 44,68 50,73 C55,76 54,80 50,84" stroke="#E2622E"/>
    <!-- reprise d'entrelacs : la fibre verte repasse devant au croisement haut -->
    <path d="M45.5,55.5 C47,56.6 48.5,57.4 50,58 C52,59 54,60 55.6,61.4" stroke="#2E7D4E"/>
  </g>

  <!-- racines -->
  <g fill="none" stroke="#2E7D4E" stroke-width="3.4" stroke-linecap="round">
    <path d="M50,84 C46,87 43,89 39,93"/>
    <path d="M50,84 C50,88 50,90 50,95"/>
    <path d="M50,84 C54,87 57,89 61,93"/>
  </g>
</svg>
